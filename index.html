<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>极简 · 未来科技</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6366f1;        /* 主色 - 靛蓝 */
      --primary-dark: #4f46e5;
      --bg: #0f172a;             /* 深蓝灰背景 */
      --bg-light: #1e293b;
      --text: #e2e8f0;
      --text-light: #94a3b8;
      --accent: #a78bfa;
      --gradient: linear-gradient(135deg, #6366f1 0%, #a78bfa 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
    }

    /* 导航栏 */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.5rem 5%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(99, 102, 241, 0.15);
      transition: all 0.3s ease;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -1px;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .nav-links a:hover {
      color: white;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -6px;
      left: 0;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* 英雄区 */
    .hero {
      height: 100vh;
      min-height: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5%;
      position: relative;
      overflow: hidden;
    }

    .hero-content {
      max-width: 900px;
      text-align: center;
      z-index: 2;
      position: relative;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3.5rem, 8vw, 6.5rem);
      font-weight: 700;
      margin-bottom: 1.5rem;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.1;
    }

    .hero p {
      font-size: 1.4rem;
      color: var(--text-light);
      margin-bottom: 2.5rem;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      display: inline-block;
      padding: 1rem 2.2rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      background: var(--primary);
      border: none;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.4s ease;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
    }

    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      margin-left: 1.5rem;
    }

    .btn-secondary:hover {
      background: var(--primary);
      color: white;
    }

    /* 背景效果 */
    .gradient-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(167, 139, 250, 0.12) 0%, transparent 50%);
      pointer-events: none;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .nav-links {
        display: none; /* 可替换为汉堡菜单 */
      }
      .hero h1 {
        font-size: 3.5rem;
      }
      .hero p {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">极简未来</div>
      <div class="nav-links">
        <a href="#home">首页</a>
        <a href="#features">功能</a>
        <a href="#about">关于</a>
        <a href="#contact">联系</a>
        <a href="#" class="btn btn-small">立即体验</a>
      </div>
    </nav>
  </header>

  <section class="hero" id="home">
    <div class="gradient-bg"></div>
    <div class="hero-content">
      <h1>构建未来的下一代体验</h1>
      <p>我们用极致简约的设计与前沿技术，打造令人惊叹的数字产品</p>
      <div style="margin-top: 2rem;">
        <a href="#" class="btn">开始探索</a>
        <a href="#" class="btn btn-secondary">了解更多</a>
      </div>
    </div>
  </section>

</body>
</html>
